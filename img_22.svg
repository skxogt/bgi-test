<path d="M131 608 L131 663" fill="none" stroke="#08717C" stroke-width="5" stroke-linecap="round"/>
<circle cx="181" cy="635.5" r="25" fill="#15324B"/>
<text x="181" y="644.5" text-anchor="middle" fill="#FFFFFF" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700">04</text>
<text x="235" y="621" fill="#08717C" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="16" letter-spacing="1.25">HUMAN REVIEW</text>
<text x="235" y="658" fill="#15324B" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="29">Who reviews the output?</text>
<path d="M958 635.5 H1030" fill="none" stroke="#B16B22" stroke-width="2.4" stroke-dasharray="7 8"/>
<circle cx="1030" cy="635.5" r="5.5" fill="#FFFFFF" stroke="#B16B22" stroke-width="2.5"/>
<path d="M540 684 L540 693" fill="none" stroke="#08717C" stroke-width="3" marker-end="url(#forward)"/>
<rect x="130" y="703" width="820" height="91" rx="15" fill="#FFFFFF" stroke="#D4E1E7" stroke-width="2" filter="url(#shadow)"/>
