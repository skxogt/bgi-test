<circle cx="1030" cy="522.5" r="5.5" fill="#FFFFFF" stroke="#B16B22" stroke-width="2.5"/>
<path d="M540 571 L540 580" fill="none" stroke="#08717C" stroke-width="3" marker-end="url(#forward)"/>
