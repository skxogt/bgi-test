<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="diagramTitle diagramDesc">
<title id="diagramTitle">AI readiness gateway: five checks before considering a pilot</title>
<desc id="diagramDesc">A five-gate checklist: Is the task clear? Is the data suitable and permitted? Are security and privacy risks understood? Who reviews the output? What would a small test prove? At each gate, a dashed connector leads to Pause or revise the idea. Only after approval should a pilot be considered.</desc>
<defs>
  <marker id="forward" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#08717C"/>
  </marker>
  <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="11" flood-color="#15324B" flood-opacity=".055"/>
  </filter>
</defs>
<rect x="0" y="0" width="1440" height="1080" fill="#F7F9FA"/>
<path d="M108 80 H1332" fill="none" stroke="#DEE8ED" stroke-width="2"/>
<rect x="108" y="99" width="102" height="30" rx="15" fill="#E5F1F2"/>
<text x="159" y="119" fill="#08717C" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="15" text-anchor="middle">SVC-19</text>
<text x="227" y="120" fill="#546874" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" letter-spacing="2" font-size="16">AI READINESS &amp; GROWTH ENABLEMENT</text>
<text x="108" y="185" fill="#15324B" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="49">Check before choosing AI</text>
<text x="110" y="224" fill="#546874" font-family="Arial,DejaVu Sans,sans-serif" font-size="21">Five decision gates • suitability, permission, risk, and human oversight</text>

