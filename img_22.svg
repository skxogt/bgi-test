<circle cx="181" cy="409.5" r="25" fill="#15324B"/>
<text x="181" y="418.5" text-anchor="middle" fill="#FFFFFF" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700">02</text>
<text x="235" y="395" fill="#08717C" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="16" letter-spacing="1.25">DATA &amp; ACCESS</text>
