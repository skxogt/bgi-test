<circle cx="181" cy="748.5" r="25" fill="#15324B"/>
<text x="181" y="757.5" text-anchor="middle" fill="#FFFFFF" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700">05</text>
<text x="235" y="734" fill="#08717C" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="16" letter-spacing="1.25">TEST CRITERIA</text>
<text x="235" y="771" fill="#15324B" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="29">What would a small test prove?</text>
<path d="M958 748.5 H1030" fill="none" stroke="#B16B22" stroke-width="2.4" stroke-dasharray="7 8"/>
<circle cx="1030" cy="748.5" r="5.5" fill="#FFFFFF" stroke="#B16B22" stroke-width="2.5"/>
<path d="M1030 296.5 V748.5" fill="none" stroke="#B16B22" stroke-width="2.6" stroke-dasharray="8 10"/>
<path d="M1030 548 H1080" fill="none" stroke="#B16B22" stroke-width="2.6" stroke-dasharray="8 9"/>
<rect x="1080" y="463" width="253" height="170" rx="16" fill="#FFF5E9" stroke="#D5A46E" stroke-width="2"/>
<text x="1105" y="495" fill="#B16B22" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="15" letter-spacing="1.2">AT ANY GATE</text>
<text x="1105" y="531" fill="#15324B" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="25">Pause or</text>
<text x="1105" y="560" fill="#15324B" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="25">revise the idea</text>
<text x="1105" y="594" fill="#546874" font-family="Arial,DejaVu Sans,sans-serif" font-size="16">Revisit inputs, risks,</text>
<text x="1105" y="615" fill="#546874" font-family="Arial,DejaVu Sans,sans-serif" font-size="16">or the proposed task.</text>
<path d="M540 797 V828" fill="none" stroke="#08717C" stroke-width="3" marker-end="url(#forward)"/>
<rect x="246" y="844" width="590" height="82" rx="17" fill="#E8F3F3" stroke="#9CC8C9" stroke-width="2"/>
<circle cx="291" cy="885" r="19" fill="#08717C"/>
<path d="M284 885 H298 M293 879 L299 885 L293 891" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="327" y="879" fill="#15324B" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700">Consider a pilot only</text>
<text x="327" y="907" fill="#15324B" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700">after approval</text>
