<text x="181" y="305.5" text-anchor="middle" fill="#FFFFFF" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700">01</text>
<text x="235" y="282" fill="#08717C" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="16" letter-spacing="1.25">TASK CLARITY</text>
<text x="235" y="319" fill="#15324B" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="29">Is the task clear?</text>
