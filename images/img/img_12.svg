<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">SVC-04 - Business capability blueprint</title>
<desc id="svg-desc">An illustrative business capability model. The business goal is supported by four capability layers: people and responsibilities, day-to-day process, tools and information, and checks and ownership. Upward arrows indicate dependencies from readiness checks toward the goal, with a dotted feedback loop. A separate panel named Gaps to investigate contains three empty lines, not completed findings.</desc>
