<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">Proposed onboarding path from agreement to first useful value</title>
<desc id="svgDesc">Five stages connected left to right: Agreement; Setup and access; Guidance; First useful milestone; Check-in. Below each, a provisional responsibility label identifies client input or provider task, using two icons for shared stages. A final question asks: How will we know this was useful? All responsibilities must be confirmed for each project. There are no dates or guaranteed outcomes.</desc>
