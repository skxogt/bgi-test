<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="figureTitle figureDescription">
<title id="figureTitle">Opportunity prioritization: four criteria and a blank worksheet</title>
<desc id="figureDescription">An illustrative unscored decision framework for SVC-02. Four equally weighted criteria are Possible value, Effort required, Confidence in evidence, and Dependencies. All four feed a decision note to discuss what deserves attention first. A separate blank worksheet has Option, Evidence, Trade-offs, and Next check headings. No opportunities are ranked and no scores or results are asserted.</desc>
<defs>
 <pattern id="subtleGrid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#DDE9ED"/></pattern>
 <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#264357" flood-opacity="0.06"/></filter>
 <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#08717C"/></marker>
</defs>
<rect width="1440" height="1080" fill="#F7F9FA"/>
<rect width="1440" height="1080" fill="url(#subtleGrid)" opacity="0.6"/>

<rect x="104" y="63" width="8" height="30" rx="4" fill="#08717C"/>
<text x="128" y="85" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#08717C" text-anchor="start" letter-spacing="2.1">SVC-02 / GROWTH OPPORTUNITY PRIORITIZATION</text>
<text x="104" y="151" font-family="Inter, Arial, Helvetica, sans-serif" font-size="45" font-weight="750" fill="#15324B" text-anchor="start" >Prioritize with reasons, not guesses.</text>
<text x="104" y="197" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#56768A" text-anchor="start" >Consider value, effort, evidence, and dependencies before choosing where to focus.</text>
