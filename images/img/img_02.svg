 <text x="1251" y="700" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="0.9" fill="#15324B">CLIENT INPUT</text>
 <text x="1251" y="731" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#60737E">Steps 1, 2 and 4</text>
