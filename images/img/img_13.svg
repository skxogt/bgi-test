<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">SVC-05 - Illustrative customer question-to-choice journey</title>
<desc id="svg-desc">Five hypothetical buyer questions lead toward an informed choice. First: What problem do I have? Next: Which options fit? Questions about proof and cost or involvement branch in parallel before What is my next step? Ends at Informed choice. This is a hypothesis to be validated with real customer evidence, not documented buyer behavior.</desc>
