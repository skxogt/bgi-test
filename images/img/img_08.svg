<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="asset-title asset-desc">
  <title id="asset-title">Two alternative starting points: AI suitability or improving an existing process</title>
  <desc id="asset-desc">A decision headed What do you need? branches equally into two distinct service paths. SVC-19: Explore an AI task, Check suitability, Review data, risks and oversight, Consider a pilot. SVC-20: Improve an existing process, Check baseline, Choose an authorized test, Review evidence. The paths are separate and do not imply deployment or guaranteed results.</desc>
  <defs>
    <pattern id="fineDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#D6E5E8" opacity="0.6"/>
    </pattern>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17344D"/>
      <stop offset="100%" stop-color="#1F4C62"/>
    </linearGradient>
    <linearGradient id="tealWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECF7F8"/>
      <stop offset="100%" stop-color="#F5FAFB"/>
    </linearGradient>
    <linearGradient id="navyWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDF3F7"/>
      <stop offset="100%" stop-color="#F7FAFC"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="135%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#16344A" flood-opacity="0.07"/>
    </filter>
    <style>
      .font { font-family:Inter,Arial,Helvetica,sans-serif; }
      .eyebrow { font:700 19px Inter,Arial,Helvetica,sans-serif; letter-spacing:2.6px; }
      .panel-eyebrow { font:700 17px Inter,Arial,Helvetica,sans-serif; letter-spacing:1.4px; }
      .panel-title { font:700 31px Inter,Arial,Helvetica,sans-serif; }
      .step { font:700 27px Inter,Arial,Helvetica,sans-serif; }
      .step-long { font:700 25px Inter,Arial,Helvetica,sans-serif; }
      .navy { fill:#17344D; }
      .teal { fill:#08717C; }
      .muted { fill:#527080; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F7FAFB"/>
  <rect width="1600" height="900" fill="url(#fineDots)"/>
  <rect width="1600" height="10" fill="#17344D"/>

  <!-- Heading uses the same BGI visual direction as the companion assets. -->
  <text x="110" y="78" class="eyebrow teal">AI / OPTIMIZATION / CONTINUOUS INTELLIGENCE</text>
  <text x="110" y="139" class="font navy" font-size="51" font-weight="750">Two different starting points</text>
  <text x="111" y="183" class="font muted" font-size="23">An AI idea and an existing growth system call for different questions.</text>
  <line x1="110" x2="1490" y1="206" y2="206" stroke="#CBDDE2" stroke-width="2"/>

  <!-- Branch point and two independent paths; neither is a mandatory stage of the other. -->
  <rect x="625" y="218" width="350" height="81" rx="22" fill="url(#navyGrad)" stroke="#315E70" stroke-width="2" filter="url(#softShadow)"/>
  <text x="800" y="246" class="font" fill="#A9DEE2" font-size="16" font-weight="700" letter-spacing="2.4" text-anchor="middle">START HERE</text>
  <text x="800" y="280" class="font" fill="#FFFFFF" font-size="30" font-weight="700" text-anchor="middle">What do you need?</text>
  <path d="M800 300 V315 H445 V335 M800 315 H1155 V335" fill="none" stroke="#79A6AE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="445" cy="335" r="6.5" fill="#08717C" stroke="#F7FAFB" stroke-width="3"/>
  <circle cx="1155" cy="335" r="6.5" fill="#08717C" stroke="#F7FAFB" stroke-width="3"/>

  <!-- Left path: SVC-19 -->
  <rect x="110" y="343" width="670" height="427" rx="24" fill="#FFFFFF" stroke="#D5E4E8" stroke-width="2" filter="url(#softShadow)"/>
  <path d="M113 373 V740" stroke="#08717C" stroke-width="6" stroke-linecap="round"/>
  <text x="150" y="387" class="panel-eyebrow teal">PATH A  /  AI SUITABILITY</text>
  <rect x="668" y="359" width="80" height="35" rx="17.5" fill="#E1F1F2" stroke="#BFDDE1"/>
  <text x="708" y="382" class="font teal" font-size="17" font-weight="800" text-anchor="middle">SVC-19</text>
  <text x="150" y="433" class="panel-title navy">Explore an AI task</text>
  <line x1="150" x2="740" y1="451" y2="451" stroke="#DCE8EB" stroke-width="2"/>

  <rect x="150" y="471" width="590" height="77" rx="17" fill="url(#tealWash)" stroke="#C6E0E5" stroke-width="1.8"/>
  <circle cx="196" cy="510" r="25" fill="#D7EAED"/>
  <text x="196" y="519" class="font teal" font-size="23" font-weight="800" text-anchor="middle">1</text>
  <text x="240" y="519" class="step navy">Check suitability</text>

  <path d="M445 550 V566" fill="none" stroke="#08717C" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M439 560 L445 568 L451 560" fill="none" stroke="#08717C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="150" y="573" width="590" height="77" rx="17" fill="url(#tealWash)" stroke="#C6E0E5" stroke-width="1.8"/>
  <circle cx="196" cy="611" r="25" fill="#D7EAED"/>
  <text x="196" y="620" class="font teal" font-size="23" font-weight="800" text-anchor="middle">2</text>
  <text x="240" y="619" class="step-long navy">Review data, risks and oversight</text>

  <path d="M445 652 V667" fill="none" stroke="#08717C" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M439 661 L445 669 L451 661" fill="none" stroke="#08717C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="150" y="675" width="590" height="76" rx="17" fill="#E6F3F4" stroke="#08717C" stroke-width="2.2"/>
  <circle cx="196" cy="713" r="25" fill="#CCE7E9"/>
  <text x="196" y="722" class="font teal" font-size="23" font-weight="800" text-anchor="middle">3</text>
  <text x="240" y="722" class="step navy">Consider a pilot</text>

  <!-- Right path: SVC-20 -->
  <rect x="820" y="343" width="670" height="427" rx="24" fill="#FFFFFF" stroke="#D5E4E8" stroke-width="2" filter="url(#softShadow)"/>
  <path d="M823 373 V740" stroke="#315B72" stroke-width="6" stroke-linecap="round"/>
  <text x="860" y="387" class="panel-eyebrow teal">PATH B  /  PROCESS IMPROVEMENT</text>
  <rect x="1378" y="359" width="80" height="35" rx="17.5" fill="#E7EEF4" stroke="#CCDCE6"/>
  <text x="1418" y="382" class="font navy" font-size="17" font-weight="800" text-anchor="middle">SVC-20</text>
  <text x="860" y="433" class="panel-title navy">Improve an existing process</text>
  <line x1="860" x2="1450" y1="451" y2="451" stroke="#DCE8EB" stroke-width="2"/>

  <rect x="860" y="471" width="590" height="77" rx="17" fill="url(#navyWash)" stroke="#D1DEE7" stroke-width="1.8"/>
  <circle cx="906" cy="510" r="25" fill="#DFE9F0"/>
  <text x="906" y="519" class="font navy" font-size="23" font-weight="800" text-anchor="middle">1</text>
  <text x="950" y="519" class="step navy">Check baseline</text>

  <path d="M1155 550 V566" fill="none" stroke="#315B72" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M1149 560 L1155 568 L1161 560" fill="none" stroke="#315B72" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="860" y="573" width="590" height="77" rx="17" fill="url(#navyWash)" stroke="#D1DEE7" stroke-width="1.8"/>
  <circle cx="906" cy="611" r="25" fill="#DFE9F0"/>
  <text x="906" y="620" class="font navy" font-size="23" font-weight="800" text-anchor="middle">2</text>
  <text x="950" y="619" class="step-long navy">Choose an authorized test</text>

  <path d="M1155 652 V667" fill="none" stroke="#315B72" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M1149 661 L1155 669 L1161 661" fill="none" stroke="#315B72" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="860" y="675" width="590" height="76" rx="17" fill="#EAF0F5" stroke="#315B72" stroke-width="2.2"/>
  <circle cx="906" cy="713" r="25" fill="#D6E4ED"/>
  <text x="906" y="722" class="font navy" font-size="23" font-weight="800" text-anchor="middle">3</text>
  <text x="950" y="722" class="step navy">Review evidence</text>

  <!-- Scope note is shared, not a connector joining the service paths. -->
  <rect x="110" y="787" width="1380" height="49" rx="15" fill="#EFF5F6" stroke="#CDDFE3" stroke-width="1.7"/>
  <circle cx="356" cy="811.5" r="12" fill="none" stroke="#08717C" stroke-width="2"/>
  <path d="M356 809 V816 M356 806 V805" fill="none" stroke="#08717C" stroke-width="2.5" stroke-linecap="round"/>
  <text x="823" y="820" text-anchor="middle" class="font navy" font-size="23" font-weight="640">Different scopes. Neither implies deployment or guaranteed results.</text>
</svg>
