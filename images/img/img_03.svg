<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="imageTitle imageDescription">
<title id="imageTitle">Choose the question you need answered — four independent service choices</title>
<desc id="imageDescription">Four independent BGI Solutions service choices, arranged as a staggered decision ladder. SVC-01, Business Growth Intelligence Assessment and Constraint Diagnosis: What is holding us back? SVC-02, Growth Opportunity Discovery and Prioritization: Which opportunity first? SVC-03, Business Growth Strategy and Roadmap Architecture: What is the plan? SVC-04, Enterprise Capability and Growth System Development: What needs to be built or changed? Dotted connectors indicate a possible relationship only, not a required sequence.</desc>
<defs>
 <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#F9FBFB"/><stop offset="1" stop-color="#F1F6F7"/></linearGradient>
 <filter id="softShadow" x="-10%" y="-35%" width="120%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#15324B" flood-opacity="0.085"/></filter>
</defs>
<rect width="1440" height="1080" fill="url(#paper)"/>
<!-- A restrained geometric motif, separated from the actual service content. -->
<circle cx="1305" cy="108" r="120" fill="#087F8C" opacity=".035"/>
<circle cx="1305" cy="108" r="84" fill="none" stroke="#087F8C" stroke-width="2" opacity=".09"/>
<text x="112" y="76" fill="#08717C" font-family="Carlito, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2.7">SERVICE DECISION GUIDE</text>
<text x="112" y="142" fill="#15324B" font-family="Carlito, Arial, sans-serif" font-size="53" font-weight="700" letter-spacing="-.6">Choose the question you need answered</text>
<text x="112" y="192" fill="#486270" font-family="Carlito, Arial, sans-serif" font-size="24">Four independent starting points. Select the one that fits your decision.</text>
