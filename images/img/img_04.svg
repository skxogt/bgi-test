<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Four research lenses: customers and market, competitors, places and feasibility, and trends and risks</title>
  <desc id="diagram-desc">A balanced research question framework. The central question, What do we need to know?, connects equally to four separate research lenses: SVC-05 Customers and market, needs customer evidence; SVC-06 Competitors, needs sourced comparisons; SVC-07 Places and feasibility, needs place facts; SVC-08 Trends and risks, needs dated signals. Solid borders indicate research questions and dashed borders indicate evidence needed. These lenses have no required sequence.</desc>
  <defs>
    <filter id="card-shadow" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#15324B" flood-opacity="0.08"/>
    </filter>
    <pattern id="dotgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#dbe8e9" opacity="0.5"/>
    </pattern>
    <linearGradient id="hub-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15324B"/><stop offset="1" stop-color="#1C495C"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#F7F9FA"/>
  <rect width="1600" height="900" fill="url(#dotgrid)" opacity="0.6"/>
  <rect x="0" y="0" width="1600" height="12" fill="#15324B"/>
  <text x="110" y="80" fill="#08717C" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3.2">BUSINESS RESEARCH  /  FOUR DISTINCT LENSES</text>
  <text x="110" y="138" fill="#15324B" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.1">Four research lenses</text>
  <text x="112" y="177" fill="#4C6471" font-family="Arial, Helvetica, sans-serif" font-size="23">Different research questions need different evidence.</text>

  <!-- Equal-weight, undirected connections; no precedence or compulsory sequence. -->
  <g fill="none" stroke="#4C8790" stroke-width="3.5" stroke-linecap="round" opacity="0.84">
    <path d="M 603 332 C 631 332 642 393 691 429"/>
    <path d="M 997 332 C 969 332 958 393 909 429"/>
    <path d="M 603 639 C 631 639 642 546 691 513"/>
    <path d="M 997 639 C 969 639 958 546 909 513"/>
  </g>
  <g fill="#F7F9FA" stroke="#4C8790" stroke-width="3.5">
