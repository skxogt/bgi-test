ght="700" letter-spacing="-0.5">Places and feasibility</text><rect x="501" y="551" width="77" height="30" rx="15" fill="#E6F2F3"/><text x="539.5" y="571.2" fill="#076B75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">SVC-07</text><rect x="141" y="642" width="438" height="77" rx="12" fill="#F8FBFC" stroke="#91AEB5" stroke-width="2" stroke-dasharray="7 6"/><text x="161" y="669" fill="#5D6D76" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" letter-spacing="1.5">EVIDENCE NEEDED</text><text x="161" y="700" fill="#18252D" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500">needs place facts</text></g><g aria-label="SVC-08 Trends and risks: needs dated signals"><rect x="990" y="527" width="500" height="220" rx="23" fill="#FFFFFF" stroke="#D9E4E8" stroke-width="2" filter="url(#card-shadow)"/><rect x="992" y="556" width="5" height="162" rx="2.5" fill="#087F8C"/><rect x="1021" y="557" width="62" height="62" rx="17" fill="#E8F2F3"/><g fill="none" stroke="#08717C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="1052" cy="588" r="20"/><circle cx="1052" cy="588" r="11"/><path d="M 1027 594 L 1038 594 L 1045 582 L 1051 600 L 1059 583 L 1064 591 L 1077 591"/></g><text x="1103" y="576" fill="#526B76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.6">RESEARCH QUESTION</text><text x="1103" y="616" fill="#15324B" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">Trends and risks</text><rect x="1381" y="551" width="77" height="30" rx="15" fill="#E6F2F3"/><text x="1419.5" y="571.2" fill="#076B75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">SVC-08</text><rect x="1021" y="642" width="438" height="77" rx="12" fill="#F8FBFC" stroke="#91AEB5" stroke-width="2" stroke-dasharray="7 6"/><text x="1041" y="669" fill="#5D