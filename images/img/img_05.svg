<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Illustrative customer discovery and decision journey with service touchpoints</title>
<desc id="desc">Five stages read Find, Understand, Trust, Ask, Decide. Illustrative service touchpoints beneath the stages: Find SVC-09; Understand SVC-11 and SVC-15; Trust SVC-10; Ask SVC-12; Decide SVC-13. SVC-14, Review acquisition costs, is in a separate business-side measurement rail spanning the full journey. Paths differ by customer and business.</desc>
