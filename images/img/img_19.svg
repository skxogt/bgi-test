  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 z" fill="#08717C"/></marker>
  <marker id="arrowSoft" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto" viewBox="0 0 7 7"><path d="M0 0 L7 3.5 L0 7 z" fill="#759CA2"/></marker>
</defs>
