<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">Illustrative customer relationship lifecycle with permission-aware follow-up</title>
<desc id="svgDesc">An open arc contains five stages: Welcome, Help with use, Ask for feedback, Review new needs, and Invite advocacy only with permission. Arrows show a potential progression without requiring every customer to follow every step. A review loop is included. The open space is labeled Not every customer follows every step. A separate callout says Respect consent and frequency. The diagram has no performance figures or testimonials.</desc>
<defs>
