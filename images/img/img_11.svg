<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="figureTitle figureDescription">
<title id="figureTitle">Illustrative growth roadmap: goals, priorities, planning, and review</title>
<desc id="figureDescription">SVC-03 business growth strategy and roadmap architecture. A four-phase sequence: Agree the goal, Select priorities, Plan the work, Review and adjust. Each phase has a proposed decision milestone and a Responsible person: to agree placeholder. Solid horizontal arrows indicate dependencies; an amber curved arrow loops from Review and adjust back to Select priorities, indicating that a roadmap may be revisited. No calendar dates, confirmed owners, or guaranteed project outcomes are shown.</desc>
