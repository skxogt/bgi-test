<rect x="855" y="388" width="43" height="27" rx="13.5" fill="#EAF5F5" stroke="none" stroke-width="0" />
<text x="876.5" y="407" fill="#08717C" font-size="14" font-weight="760" text-anchor="middle" >03</text>
<circle cx="1063" cy="425" r="25" fill="#EAF5F5"/>
