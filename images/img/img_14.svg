<circle cx="1423" cy="425" r="25" fill="#EAF5F5"/>
<path d="M 1408 414 H 1438 V 434 H 1421 L 1412 441 V 434 H 1408 Z" fill="none" stroke="#08717C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<line x1="1415" y1="421" x2="1432" y2="421" stroke="#08717C" stroke-width="2" />
<line x1="1415" y1="428" x2="1428" y2="428" stroke="#08717C" stroke-width="2" />
<text x="1215" y="454" fill="#627783" font-size="13" font-weight="720" text-anchor="start" letter-spacing="0.9">NEXT ACTION</text>
<text x="1215" y="496" fill="#15324B" font-size="27" font-weight="720" text-anchor="start" >Clear inquiry</text>
<text x="1215" y="530" fill="#15324B" font-size="27" font-weight="720" text-anchor="start" >option</text>
</g>
<line x1="613" y1="557" x2="613" y2="605" stroke="#08717C" stroke-width="2" stroke-dasharray="5 8"/>
<line x1="1333" y1="557" x2="1333" y2="605" stroke="#08717C" stroke-width="2" stroke-dasharray="5 8"/>
<rect x="443" y="606" width="340" height="130" rx="18" fill="#F2F8F8" stroke="#C9E0E2" stroke-width="1.7" />
<rect x="458" y="622" width="5" height="98" rx="2" fill="#08717C" stroke="none" stroke-width="0" />
<text x="478" y="636" fill="#08717C" font-size="14" font-weight="760" text-anchor="start" letter-spacing="1">VISIBILITY NOTE</text>
<text x="478" y="675" fill="#18252D" font-size="19" font-weight="590" text-anchor="start" >Being visible is not the</text>
<text x="478" y="703" fill="#18252D" font-size="19" font-weight="590" text-anchor="start" >same as ranking first</text>
<rect x="1168" y="606" width="330" height="130" rx="18" fill="#F8F8F5" stroke="#E2E2D7" stroke-width="1.7" />
<rect x="1183" y="622" width="5" height="98" rx="2" fill="#C77926" stroke="none" stroke-width="0" />
<text x="1203" y="636" fill="#08717C" font-size="14" font-weight="760" text-anchor="start" letter-spacing="1">CONTACT NOTE</text>
<text x="1203" y="675" fill="#18252D" font-size="19" font-weight="590" text-anchor="start" >Requires a working</text>
<text x="1203" y="703" fill="#18252D" font-size="19" font-weight="590" text-anchor="start" >contact route</text>
<rect x="107" y="747" width="10" height="10" rx="5" fill="#C77926" stroke="none" stroke-width="0" />
<text x="130" y="759" fill="#627783" font-size="17" font-weight="450" text-anchor="start" >Concept only: actual visibility, listings and inquiries require verification.</text>
<rect x="85" y="807" width="10" height="10" rx="5" fill="#C77926" stroke="none" stroke-width="0" />
<text x="106" y="821" fill="#627783" font-size="19" font-weight="610" text-anchor="start" >Possible discovery path - not a ranking or conversion claim</text>
<text x="1510" y="821" fill="#08717C" font-size="15" font-weight="720" text-anchor="end" letter-spacing="0.5">SVC-09  /  DIGITAL VISIBILITY</text>
</g></svg>