<filter id="softShadow" x="-15%" y="-20%" width="130%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17364B" flood-opacity="0.08"/></filter>
<marker id="tip" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#08717C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F9FA" stroke="none" stroke-width="0" />
<rect x="42" y="35" width="1516" height="830" rx="30" fill="url(#surface)" stroke="#E6EEF1" stroke-width="2" />
