<text x="85" y="165" fill="#15324B" font-size="45" font-weight="750" text-anchor="start" >From discovery to a useful inquiry</text>
<text x="87" y="209" fill="#627783" font-size="22" font-weight="430" text-anchor="start" >A possible path from a customer question to a practical next step.</text>
<line x1="85" y1="239" x2="1512" y2="239" stroke="#DAE5E8" stroke-width="2" />
<rect x="76" y="268" width="1448" height="508" rx="24" fill="#FFFFFF" stroke="#DAE5E8" stroke-width="2" />
<text x="107" y="308" fill="#08717C" font-size="16" font-weight="740" text-anchor="start" letter-spacing="2">ILLUSTRATIVE DISCOVERY PATH</text>
<rect x="1299" y="287" width="185" height="32" rx="16" fill="#EAF5F5" stroke="none" stroke-width="0" />
<text x="1391" y="307" fill="#08717C" font-size="14" font-weight="730" text-anchor="middle" letter-spacing="0.8">NOT RANKING DATA</text>
