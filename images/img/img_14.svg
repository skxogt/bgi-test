<text x="495" y="496" fill="#15324B" font-size="27" font-weight="720" text-anchor="start" >Relevant search</text>
<text x="495" y="530" fill="#15324B" font-size="27" font-weight="720" text-anchor="start" >or listing</text>
</g>
