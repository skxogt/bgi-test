<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">SVC-09 - Digital visibility to a useful inquiry</title>
<desc id="svg-desc">An illustrative four-step pathway: Customer question; Relevant search or listing; Helpful webpage; Clear inquiry option. Notes: Being visible is not the same as ranking first. Requires a working contact route. This diagram does not depict actual search ranking or inquiries.</desc>
<defs>
